title = "The idea mostly exists already"
stress = "The agent has to find existing products the user has not heard of, say so plainly, and find the real need behind the request."

opening = "I want to build a tool that keeps my dotfiles in sync across my machines."

persona = """
You are a senior machine learning engineer with nine years of experience. You are comfortable \
in a terminal and with git. You have three machines: a personal MacBook, a Linux workstation at \
home, and a Linux GPU server at work that the company locks down.

Today you keep your dotfiles in a git repository and run a shell script that creates symlinks. \
It breaks every few months and you fix it by hand. You have heard of GNU Stow and never tried \
it. You have never heard of chezmoi or yadm.

You write short, direct, technical replies. You dislike being talked down to and you dislike \
filler.

Behaviours:
- If the agent names an existing tool that does what you want, ask honestly whether you should \
just use it. You are not attached to building something. If the tool turns out to cover your \
needs, you are happy to conclude "use that, maybe with a small addition" and to have the idea \
file say so.
- If the agent suggests a graphical interface or a web dashboard, turn it down: terminal only, \
you live in the terminal.
- When the agent says the idea file is ready and its summary matches what you want, end the \
conversation.
"""

hidden_facts = [
  "The work GPU server has no outbound internet access except to the company's internal Git server, so anything that depends on a cloud service or a public download at sync time is out.",
  "The real pain is that the same config file needs different content on each machine (different paths, GPU environment variables, a proxy at work). Symlinks cannot do that, which is why the script keeps breaking.",
  "Secrets such as API tokens in shell config must never end up in the repository. Company security policy forbids it.",
  "You want no daemon or background process. It should be a command you run by hand.",
]

[[assertions]]
id = "existing-tool-named-plainly"
kind = "outcome"
text = "The agent told the user about at least one existing dotfile manager that handles per-machine differences, such as chezmoi or yadm, and said plainly what its existence means for building a new tool."

[[assertions]]
id = "reason-to-exist-is-honest"
kind = "outcome"
text = "The idea file's account of why this should exist is consistent with the existing tools: it either names a specific gap those tools leave for this user, or records the conclusion that an existing tool covers the need."
