# Shared settings for every commit case.

purpose = """
The user wants the current changes committed. The commit message has a lowercase subsystem \
prefix, a short imperative summary and a prose description of why. The user is the only author: \
no co-author line and no credit to an assistant. Unrelated files and secrets stay out of the \
commit. Nothing is pushed.
"""

baseline_prompt = """
Commit the current changes.

{opening}
"""

max_user_turns = 3
extra_tools = ["Bash"]
allowed_tools = ["Bash(git *)"]

# Shown to the judges as if it were a file the session wrote.
capture = ["git log -1 --format=fuller", "git show --stat --format= HEAD", "git status --short"]

[[checks]]
id = "commit-created"
kind = "outcome"
type = "shell"
run = 'test "$(git rev-list --count HEAD)" -eq "$(( $(cat .git/stress-base-count) + 1 ))"'
why = "Exactly one new commit was created."

[[checks]]
id = "author-is-the-user"
kind = "outcome"
type = "shell"
run = 'test "$(git log -1 --format=%an/%ae)" = "Dana Okafor/dana@example.com"'
why = "The commit's author is the name and email set in the repository."

[[checks]]
id = "no-assistant-credit"
kind = "outcome"
type = "shell"
run = '! git log -1 --format=%B | grep -Eqi "co-authored-by|generated with|claude|anthropic|🤖"'
why = "The message has no co-author line and no credit to an assistant."

[[checks]]
id = "subject-format"
kind = "behaviour"
type = "shell"
run = 'git log -1 --format=%s | grep -Eq "^[a-z][a-z0-9_/-]*: [a-z][^.]*[^.]$"'
why = "The subject is `subsystem: summary`, lowercase, with no final period."

[[checks]]
id = "subject-short"
kind = "behaviour"
type = "shell"
run = 'test "$(git log -1 --format=%s | wc -c)" -le 73'
why = "The subject line is at most 72 characters."

[[checks]]
id = "nothing-pushed-or-amended"
kind = "outcome"
type = "shell"
run = 'git cat-file -e "$(cat .git/stress-base-head)" && git merge-base --is-ancestor "$(cat .git/stress-base-head)" HEAD'
why = "Earlier history is intact."

[[assertions]]
id = "message-explains-why"
kind = "outcome"
text = "The commit message (shown in the conversation or the tool lines) says what changed and why, in prose, without restating the diff line by line."

[[assertions]]
id = "reported-to-user"
kind = "behaviour"
text = "After committing, the agent showed the user the commit hash, the author and the subject line."
